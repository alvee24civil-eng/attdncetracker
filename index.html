<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<title>Tracker</title>
<link rel="manifest" id="manifest-placeholder">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@property --accent{syntax:'<color>';inherits:true;initial-value:#6c63ff}
:root{--accent:#6c63ff;transition:--accent .6s ease;--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--surface3:#242433;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#f0f0ff;--text2:#9898b8;--text3:#5a5a7a;--accent2:color-mix(in srgb,var(--accent) 68%,#fff);--accent-bg:color-mix(in srgb,var(--accent) 13%,transparent);--accent-border:color-mix(in srgb,var(--accent) 38%,transparent);--green:#22c55e;--green-bg:rgba(34,197,94,.1);--green-border:rgba(34,197,94,.3);--green-text:#4ade80;--red:#ef4444;--red-bg:rgba(239,68,68,.1);--red-border:rgba(239,68,68,.3);--red-text:#f87171;--yellow:#f59e0b;--yellow-bg:rgba(245,158,11,.1);--yellow-border:rgba(245,158,11,.3);--yellow-text:#fbbf24;--radius:14px;--r-sm:8px;--r-pill:100px}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overscroll-behavior:none}
button,input,select{font-family:inherit;color:inherit}
.header{padding:52px 20px 16px;background:linear-gradient(180deg,#0f0f1a,var(--bg));position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;justify-content:space-between}
.app-badge{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent2);background:var(--accent-bg);border:1px solid var(--accent-border);padding:3px 10px;border-radius:var(--r-pill)}
.pill-btn{font-size:11px;font-weight:700;color:var(--accent2);background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:var(--r-pill);padding:5px 12px;cursor:pointer}
.pill-btn:active{opacity:.7}
.header-title{font-size:26px;font-weight:900;letter-spacing:-.03em;margin-top:10px;line-height:1}
#h-hl{color:var(--accent2)}
.header{overflow:hidden}.header>*{position:relative}
.header::before{content:'';position:absolute;width:280px;height:280px;right:-90px;top:-110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 40%,transparent),transparent 65%);filter:blur(8px);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
.credit{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--text3)}
.cr-t{opacity:0;animation:crFade .7s ease .5s forwards}
@keyframes crFade{to{opacity:1}}
.stamp{position:relative;display:inline-block;font-weight:900;font-size:11px;letter-spacing:.14em;color:var(--accent2);border:1.5px solid var(--accent2);border-radius:4px;padding:1px 7px;opacity:0;transform:scale(2.8) rotate(-14deg);animation:slam .32s cubic-bezier(.6,0,.9,.4) 1.1s forwards}
@keyframes slam{0%{opacity:0;transform:scale(2.8) rotate(-14deg)}65%{opacity:1;transform:scale(.9) rotate(-4deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
.stamp::after{content:'';position:absolute;inset:-2px;border:2px solid var(--accent2);border-radius:6px;opacity:0;animation:ripple .8s ease-out 1.38s}
@keyframes ripple{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6,3.2)}}
.shake{animation:shake .38s linear!important}
@keyframes shake{0%,100%{translate:0 0}15%{translate:-3px 2px}30%{translate:3px -2px}45%{translate:-2px -1px}60%{translate:2px 1px}80%{translate:-1px 1px}}
@keyframes drift{to{transform:translate(-70px,50px) scale(1.3)}}
.hbtns{display:flex;gap:6px}.header-sub{white-space:pre-wrap}
.header-sub{font-size:12px;color:var(--text3);margin-top:4px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 20px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 10px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c)}
.stat-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3)}
.stat-num{font-size:24px;font-weight:800;letter-spacing:-.04em;margin-top:2px}
.ok{color:var(--green-text)}.bad{color:var(--red-text)}.warn{color:var(--yellow-text)}
.ring-wrap{padding:20px 20px 0;display:flex;align-items:center;gap:16px}
.ring-pct{font-size:32px;font-weight:900;letter-spacing:-.04em}
.ring-label{font-size:11px;color:var(--text3);margin-top:2px;font-weight:500}
.bar{height:4px;background:var(--surface3);border-radius:4px;overflow:hidden}
.ring-wrap .bar{margin-top:8px;width:140px}
.fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.fill.ok{background:var(--green)}.fill.warn{background:var(--yellow)}.fill.bad{background:var(--red)}
.ring-req{font-size:10px;color:var(--text3);margin-top:4px;max-width:210px;line-height:1.4}
.legend{display:flex;gap:10px;padding:12px 20px 0;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);font-weight:500}
.leg-dot{width:8px;height:8px;border-radius:2px}
.weeks{padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
.week-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.week-card.is-open{border-color:var(--accent-border)}
.week-hdr{display:flex;align-items:center;padding:14px 16px;cursor:pointer;gap:12px}
.week-num-badge{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text2);flex-shrink:0}
.is-open .week-num-badge{background:var(--accent-bg);color:var(--accent2)}
.week-hdr-info{flex:1}
.week-hdr-title{font-size:14px;font-weight:700}
.week-hdr-sub{font-size:11px;color:var(--text3);margin-top:1px}
.tag{font-size:10px;color:var(--text3);font-weight:500}
.week-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);border:1px solid;background:var(--surface2);border-color:var(--border2);color:var(--text3)}
.week-pill.ok{background:var(--green-bg);border-color:var(--green-border)}
.week-pill.warn{background:var(--yellow-bg);border-color:var(--yellow-border)}
.week-pill.bad{background:var(--red-bg);border-color:var(--red-border)}
.week-chevron{font-size:16px;color:var(--text3);transition:transform .25s}
.week-chevron.open{transform:rotate(180deg)}
.week-progress{margin:0 16px 12px}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.is-open>.collapse{grid-template-rows:1fr}
.week-body{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .45s}.is-open .week-body{visibility:visible;transition-delay:0s}.wb-in{border-top:1px solid var(--border)}
.just-opened .class-row{animation:rowIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(-12px)}}
.enter{animation:enterUp .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*55ms)}
@keyframes enterUp{from{opacity:0;transform:translateY(16px)}}
.att-btn.tapped{animation:tapPop .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes tapPop{0%{transform:scale(.82)}100%{transform:scale(1)}}
.week-card{transition:border-color .35s,transform .2s}.week-hdr:active{background:var(--surface2)}
.pop{position:fixed;top:92px;right:20px;z-index:400;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;max-width:230px;box-shadow:0 14px 40px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.94);transform-origin:top right;transition:opacity .22s,transform .3s cubic-bezier(.3,1.4,.5,1),visibility 0s .3s}
.pop.open{opacity:1;visibility:visible;transform:none;transition:opacity .22s,transform .3s cubic-bezier(.3,1.4,.5,1)}
.pop .sw-row{gap:10px}.pop .ed-hint{margin-top:10px}
.pop-reset{margin-top:8px;background:none;border:none;color:var(--accent2);font-size:11px;font-weight:700;cursor:pointer;padding:0}
.sw-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:none;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.sw:hover{transform:scale(1.12)}.sw.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c);transform:scale(1.1)}
input[type=color]{width:34px;height:34px;border:none;border-radius:50%;background:none;padding:0;cursor:pointer}
.ed-slot.new{animation:enterUp .4s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.day-lbl{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);padding:8px 16px;background:var(--accent-bg)}
.class-row{display:flex;align-items:center;padding:10px 16px;gap:12px;border-top:1px solid var(--border)}
.class-icon,.subj-icon{width:34px;height:34px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text3);flex-shrink:0}
.class-info{flex:1;min-width:0}
.class-code{font-size:13px;font-weight:700}
.class-period-tag{display:inline-block;font-size:9px;font-weight:700;background:var(--surface3);color:var(--text3);padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.class-name{font-size:11px;color:var(--text3);margin-top:2px}
.att-btn{min-width:86px;height:32px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface2);cursor:pointer;font-size:11px;font-weight:700;color:var(--text3);flex-shrink:0;transition:transform .15s,background-color .3s,border-color .3s,color .3s}
.att-btn:active{transform:scale(.92)}
.att-btn.p{background:var(--green-bg);border-color:var(--green-border);color:var(--green-text)}
.att-btn.a{background:var(--red-bg);border-color:var(--red-border);color:var(--red-text)}
.att-btn.e{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow-text)}
.subj-section{padding:16px 20px 120px}
.subj-heading{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.subj-heading::after{content:'';flex:1;height:1px;background:var(--border)}
.subj-grid{display:flex;flex-direction:column;gap:8px}
.subj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.subj-card-top{display:flex;align-items:center;gap:10px}
.subj-icon{width:32px;height:32px;font-size:12px}
.subj-card-info{flex:1;min-width:0}
.subj-code{font-size:13px;font-weight:700}
.subj-name{font-size:10px;color:var(--text3);margin-top:1px}
.subj-pct-badge{font-size:13px;font-weight:800;padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--border2);background:var(--surface2);color:var(--text3)}
.subj-pct-badge.ok{background:var(--green-bg);border-color:var(--green-border);color:var(--green-text)}
.subj-pct-badge.warn{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow-text)}
.subj-pct-badge.bad{background:var(--red-bg);border-color:var(--red-border);color:var(--red-text)}
.subj-card .bar{margin-top:10px}
.subj-counters{display:flex;gap:6px;margin-top:8px}
.subj-cnt{flex:1;background:var(--surface2);border-radius:var(--r-sm);padding:6px 8px;text-align:center}
.subj-cnt-val{font-size:16px;font-weight:800;letter-spacing:-.03em}
.subj-cnt-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-top:1px}
/* EDITOR */
.editor{position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;padding:0 20px 40px;opacity:0;visibility:hidden;transform:translateY(28px);transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s}
.editor.open{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.ed-top{position:sticky;top:0;background:var(--bg);padding:48px 0 12px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.ed-top h2{font-size:20px;font-weight:900;letter-spacing:-.02em}
.ed-x{background:var(--surface2);border:1px solid var(--border2);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.ed-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:10px}
.ed-box label.t{font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:8px}
.ed-select,.ed-in{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:9px 10px;font-size:13px;outline:none}
.ed-in:focus,.ed-select:focus{border-color:var(--accent-border)}
.ed-hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.45}
.ed-day{margin-top:14px}
.ed-day h3{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
.ed-slot{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px;margin-bottom:6px;display:grid;grid-template-columns:1fr 78px 34px;gap:6px}
.ed-slot .ed-in:nth-child(3){grid-column:1/3}
.ed-del{grid-row:1;grid-column:3;background:var(--red-bg);border:1px solid var(--red-border);color:var(--red-text);border-radius:var(--r-sm);cursor:pointer;font-size:16px}
.ed-add{width:100%;background:none;border:1px dashed var(--border2);border-radius:var(--r-sm);padding:8px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer}
.ed-scope{display:flex;flex-direction:column;gap:8px}
.ed-scope label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.ed-actions{display:flex;gap:8px;margin-top:16px}
.ed-actions button{flex:1;height:44px;border-radius:var(--r-sm);font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:var(--surface2)}
.ed-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.install-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface2);border-top:1px solid var(--border2);padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:200}
.install-text{flex:1;font-size:12px;color:var(--text2)}
.install-text strong{display:block;font-size:14px;color:var(--text)}
.install-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer}
.install-dismiss{background:none;border:none;color:var(--text3);font-size:24px;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <span class="app-badge" id="h-badge"></span>
    <div class="hbtns">
      <button class="pill-btn hidden" id="edit-btn" onclick="openEditor(curWeek())">✎ Routine</button>
      <button class="pill-btn" id="cust-btn" onclick="openCust()">Color</button>
    </div>
  </div>
  <div class="header-title"><span id="h-title"></span><span id="h-hl"></span></div>
  <div class="header-sub" id="h-sub"></div>
  <div class="credit"><span class="cr-t">coded bluntly by</span><span class="stamp">JINX</span></div>
</div>

<div class="stats">
  <div class="stat" style="--c:var(--accent)"><div class="stat-lbl">Held</div><div class="stat-num" id="s-total">0</div></div>
  <div class="stat" style="--c:var(--green)"><div class="stat-lbl">Present</div><div class="stat-num ok" id="s-present">0</div></div>
  <div class="stat" style="--c:var(--red)"><div class="stat-lbl">Absent</div><div class="stat-num bad" id="s-absent">0</div></div>
  <div class="stat" style="--c:var(--yellow)"><div class="stat-lbl">Overall</div><div class="stat-num" id="s-pct-sm">—</div></div>
</div>

<div class="ring-wrap">
  <svg width="72" height="72" viewBox="0 0 72 72" style="flex-shrink:0">
    <circle cx="36" cy="36" r="28" fill="none" stroke="#1c1c26" stroke-width="8"/>
    <circle id="ring-circle" cx="36" cy="36" r="28" fill="none" stroke="#6c63ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="175.9" transform="rotate(-90 36 36)" style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1),stroke .4s"/>
  </svg>
  <div>
    <div class="ring-pct" id="ring-pct">—</div>
    <div class="ring-label">attendance rate</div>
    <div class="bar"><div class="fill ok" id="ring-bar-fill" style="width:0%"></div></div>
    <div class="ring-req">Min. required: <strong>60%</strong></div>
  </div>
</div>

<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:var(--green)"></div>Present</div>
  <div class="leg"><div class="leg-dot" style="background:var(--red)"></div>Absent</div>
  <div class="leg"><div class="leg-dot" style="background:var(--yellow)"></div>Excused</div>
  <div class="leg"><div class="leg-dot" style="background:var(--surface3)"></div>Unmarked</div>
</div>

<div class="weeks" id="weeks-list"></div>

<div class="subj-section">
  <div class="subj-heading">Subject Attendance <span class="pill-btn" id="subj-toggle" onclick="toggleSubj()">▾ Hide</span></div>
  <div class="subj-grid" id="subj-grid"></div>
</div>


<div class="editor" id="editor"></div>
<div class="editor" id="cust"></div>
<div class="pop" id="pop"></div>

<div class="install-bar hidden" id="install-bar">
  <div class="install-text"><strong>Add to Home Screen</strong>Works offline, saves your data</div>
  <button class="install-btn" id="install-btn">Install</button>
  <button class="install-dismiss" id="install-dismiss">×</button>
</div>

<script>
const WEEKS=12;
const DAYS=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const clone=o=>JSON.parse(JSON.stringify(o));
let uid=0;const nid=()=>'s'+Date.now().toString(36)+(uid++);

// Starting routines. [code, name, period]
const OLD={
 Saturday:[["CE 2103","Engg. Materials · MSI","P1"],["Hum 2101","Humanities · MB","P2"],["Math 2101","Mathematics III · IAY","P3"],["CE 2122","Fluid Lab · HMR/BR/MDA","P7–9"]],
 Sunday:[["CE 2110","Surveying · MRI","P1–3"],["CE 2103","Engg. Materials · MMS","P4"],["CE 2121","Fluid Mechanics · X","P6"]],
 Monday:[["Math 2101","Mathematics III · IAY","P1"],["CE 2103","Engg. Materials · MSI","P2"],["CE 2121","Fluid Mechanics · BR","P3"],["CE 2104","Concrete Lab · MMS/MSI/X","P4–6"]],
 Tuesday:[["Math 2101","Mathematics III · MHU","P1"],["Hum 2101","Humanities · NF","P2"],["CE 2121","Fluid Mechanics · BR","P4"],["CE 2103","Engg. Materials · MMS","P5"],["CE 2111","Numerical Methods · MKZ","P7–8"]],
 Wednesday:[["CE 2121","Fluid Mechanics · X","P4"],["CE 2111","Numerical Methods · KJS","P5"]]};
const NEW={
 Saturday:[["CE 2103","Engg. Materials · MSI","P1"],["Hum 2101","Humanities · MB","P2"],["Math 2101","Mathematics III · IAY","P5"]],
 Sunday:[["CE 2110","Surveying · MRI","P1–3"],["CE 2103","Engg. Materials · MMS","P4"],["CE 2121","Fluid Mechanics · MRH","P5"],["CE 2111","Numerical Methods · KJS","P6"]],
 Monday:[["Math 2101","Mathematics III · IAY","P1"],["CE 2103","Engg. Materials · MSI","P2"],["CE 2121","Fluid Mechanics · BR","P3"],["CE 2104","Concrete Lab · MMS/MSI/AS","P4–6"]],
 Tuesday:[["Math 2101","Mathematics III · MHU","P1"],["Hum 2101","Humanities · NF","P2"],["CE 2121","Fluid Mechanics · BR","P4"],["CE 2103","Engg. Materials · MMS","P5"],["CE 2111","Numerical Methods · MKZ","P7–8"]],
 Wednesday:[["CE 2122","Fluid Lab · HMR/BR/MDA","P1–3"],["CE 2121","Fluid Mechanics · MRH","P5"]]};
const build=(pre,data)=>DAYS.map(d=>({day:d,slots:(data[d]||[]).map((x,i)=>({id:pre+d.slice(0,3)+i,code:x[0],name:x[1],period:x[2]}))}));

const DEFAULT_META={badge:'RUET · Civil Engg.',title:'Track',hl:'er',sub:'Section B  ·  2nd Year Odd Semester 2024',accent:'#6c63ff'};
const KEY='attendx_v5';
let st=load();
st.meta=Object.assign({},DEFAULT_META,st.meta||{});
let openWeeks=new Set([0]);
let deferredPrompt=null;

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.routines&&s.att)return s;}catch(e){}
  const routines=[{from:0,days:build('o',OLD)},{from:1,days:build('n',NEW)}];
  const att=Array.from({length:WEEKS},()=>({}));
  // carry over data saved by the previous version
  try{
    const old=JSON.parse(localStorage.getItem('attendx_v4'));
    if(old&&old.length===WEEKS)old.forEach((wk,w)=>wk.forEach((day,d)=>day.forEach((v,i)=>{
      const sl=routines[w===0?0:1].days[d].slots[i];
      if(sl&&v)att[w][sl.id]=v;
    })));
  }catch(e){}
  return{routines,att};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

// the routine in force for a week = the latest version that starts on or before it
function sched(w){let r=st.routines[0];st.routines.forEach(x=>{if(x.from<=w)r=x;});return r.days;}
function curWeek(){const w=[...openWeeks].sort((a,b)=>a-b)[0];return w===undefined?0:w;}

const cycle=s=>s===null||s===undefined?'p':s==='p'?'a':s==='a'?'e':null;
const label=s=>s==='p'?'✓  Present':s==='a'?'✗  Absent':s==='e'?'!  Excused':'Mark';
const cls=p=>p>=75?'ok':p>=60?'warn':'bad';

// Excused classes never happened, so they are left out of "held" and of every percentage.
function tally(w){
  let p=0,a=0,e=0;
  sched(w).forEach(d=>d.slots.forEach(s=>{const v=st.att[w][s.id];if(v==='p')p++;else if(v==='a')a++;else if(v==='e')e++;}));
  return{p,a,e,held:p+a};
}
function globalStats(){
  let p=0,a=0,e=0;
  for(let w=0;w<WEEKS;w++){const t=tally(w);p+=t.p;a+=t.a;e+=t.e;}
  return{p,a,e,held:p+a};
}
function subjectStats(){
  const map={};
  for(let w=0;w<WEEKS;w++)sched(w).forEach(d=>d.slots.forEach(s=>{
    const m=map[s.code]||(map[s.code]={code:s.code,name:s.name.split('·')[0].trim(),p:0,a:0,e:0});
    const v=st.att[w][s.id];if(v)m[v]++;
  }));
  return Object.values(map);
}
function codeIcon(c){
  if(c.includes('Math'))return'∑';if(c.includes('Hum'))return'✦';
  if(c.includes('2122')||c.includes('2121'))return'≋';if(c.includes('2110'))return'◎';
  if(c.includes('2104'))return'▦';if(c.includes('2111'))return'λ';
  return c.replace(/\D/g,'').slice(-2)||c.slice(0,2);
}

let subjOpen=true;
function toggleSubj(){subjOpen=!subjOpen;document.getElementById('subj-grid').style.display=subjOpen?'':'none';document.getElementById('subj-toggle').textContent=subjOpen?'▾ Hide':'▸ Show';}

let booted=false,lastPop=null;
const prevPct={};
function tween(el,to,suffix){
  suffix=suffix||'';
  if(to===null){el.textContent='—';el.dataset.v=0;return;}
  const from=+el.dataset.v||0,t0=performance.now();el.dataset.v=to;
  const step=t=>{const k=Math.min(1,(t-t0)/500),v=from+(to-from)*(1-Math.pow(1-k,3));el.textContent=Math.round(v)+suffix;if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function growBars(){requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('[data-to]').forEach(f=>{f.style.width=f.dataset.to+'%';f.removeAttribute('data-to');})));}

function updateSubjectGrid(){
  const grid=document.getElementById('subj-grid');grid.innerHTML='';
  subjectStats().forEach((s,i)=>{
    const held=s.p+s.a,pct=held?Math.round(s.p/held*100):null,c=pct===null?'':cls(pct),k='s'+s.code;
    const el=document.createElement('div');el.className='subj-card'+(booted?'':' enter');el.style.setProperty('--d',8+i);
    el.innerHTML=`<div class="subj-card-top"><div class="subj-icon">${esc(codeIcon(s.code))}</div>
      <div class="subj-card-info"><div class="subj-code">${esc(s.code)}</div><div class="subj-name">${esc(s.name)}</div></div>
      <div class="subj-pct-badge ${c}">${pct!==null?pct+'%':'—'}</div></div>
      <div class="bar"><div class="fill ${c}" data-to="${pct||0}" style="width:${prevPct[k]||0}%"></div></div>
      <div class="subj-counters">
        <div class="subj-cnt"><div class="subj-cnt-val">${held}</div><div class="subj-cnt-lbl">Held</div></div>
        <div class="subj-cnt"><div class="subj-cnt-val ok">${s.p}</div><div class="subj-cnt-lbl">Attended</div></div>
        <div class="subj-cnt"><div class="subj-cnt-val bad">${s.a}</div><div class="subj-cnt-lbl">Missed</div></div>
        <div class="subj-cnt"><div class="subj-cnt-val warn">${s.e}</div><div class="subj-cnt-lbl">Excused</div></div>
      </div>`;
    prevPct[k]=pct||0;grid.appendChild(el);
  });
}

function render(){
  const box=document.getElementById('weeks-list');box.innerHTML='';
  for(let w=0;w<WEEKS;w++){
    const open=openWeeks.has(w),t=tally(w),pct=t.held?Math.round(t.p/t.held*100):null;
    const changed=w>0&&st.routines.some(r=>r.from===w);
    const card=document.createElement('div');card.className='week-card'+(open?' is-open':'')+(booted?'':' enter');
    card.style.setProperty('--d',Math.min(4+w,14));
    const sub=t.held||t.e?`${t.p} of ${t.held} held classes attended${t.e?' · '+t.e+' excused':''}`:'No data yet';
    const hdr=document.createElement('div');hdr.className='week-hdr';
    hdr.innerHTML=`<div class="week-num-badge">${w+1}</div>
      <div class="week-hdr-info"><div class="week-hdr-title">Week ${w+1}${changed?' <span class="tag">(routine changed)</span>':''}</div><div class="week-hdr-sub">${sub}</div></div>
      <span class="week-pill ${pct===null?'':cls(pct)}">${pct!==null?pct+'%':'—'}</span>
      <span class="week-chevron${open?' open':''}">⌄</span>`;
    const chev=hdr.querySelector('.week-chevron');
    hdr.onclick=()=>{
      if(openWeeks.has(w)){openWeeks.delete(w);card.classList.remove('is-open');chev.classList.remove('open');}
      else{openWeeks.add(w);card.classList.add('is-open','just-opened');chev.classList.add('open');setTimeout(()=>card.classList.remove('just-opened'),900);}
    };
    card.appendChild(hdr);
    const k='w'+w;
    if(pct!==null){const pb=document.createElement('div');pb.className='week-progress bar';pb.innerHTML=`<div class="fill ${cls(pct)}" data-to="${pct}" style="width:${prevPct[k]||0}%"></div>`;card.appendChild(pb);}
    prevPct[k]=pct||0;
    const col=document.createElement('div');col.className='collapse';
    const body=document.createElement('div');body.className='week-body';
    const inner=document.createElement('div');inner.className='wb-in';
    let ri=0;
    sched(w).forEach(day=>{
      if(!day.slots.length)return;
      const lbl=document.createElement('div');lbl.className='day-lbl';
      lbl.textContent=day.day;inner.appendChild(lbl);
      day.slots.forEach(slot=>{
        const s=st.att[w][slot.id]||null;
        const row=document.createElement('div');row.className='class-row';row.style.setProperty('--i',ri++);
        row.innerHTML=`<div class="class-icon">${esc(codeIcon(slot.code))}</div><div class="class-info">
          <div class="class-code">${esc(slot.code)}<span class="class-period-tag">${esc(slot.period)}</span></div>
          <div class="class-name">${esc(slot.name)}</div></div>`;
        const b=document.createElement('button');b.className='att-btn'+(s?' '+s:'');b.textContent=label(s);
        if(lastPop===w+'|'+slot.id){b.classList.add('tapped');lastPop=null;}
        b.onclick=e=>{e.stopPropagation();const n=cycle(s);if(n)st.att[w][slot.id]=n;else delete st.att[w][slot.id];lastPop=w+'|'+slot.id;save();render();};
        row.appendChild(b);inner.appendChild(row);
      });
    });
    body.appendChild(inner);col.appendChild(body);card.appendChild(col);
    box.appendChild(card);
  }
  updateStats();
  booted=true;growBars();
}

function updateStats(){
  const g=globalStats(),pct=g.held?Math.round(g.p/g.held*100):null;
  tween(document.getElementById('s-total'),g.held);
  tween(document.getElementById('s-present'),g.p);
  tween(document.getElementById('s-absent'),g.a);
  const sm=document.getElementById('s-pct-sm');tween(sm,pct,'%');sm.className='stat-num'+(pct===null?'':pct>=75?' ok':' bad');
  updateSubjectGrid();
  const ring=document.getElementById('ring-circle'),rp=document.getElementById('ring-pct'),rb=document.getElementById('ring-bar-fill'),C=175.9;
  if(pct!==null){
    ring.style.strokeDashoffset=C-pct/100*C;ring.style.stroke=pct>=75?'#22c55e':pct>=60?'#f59e0b':'#ef4444';
    tween(rp,pct,'%');rp.className='ring-pct '+cls(pct);rb.style.width=pct+'%';rb.className='fill '+cls(pct);
  }else{ring.style.strokeDashoffset=C;ring.style.stroke='var(--accent)';tween(rp,null);rp.className='ring-pct';rb.style.width='0%';}
}

/* ---------- SHEETS ---------- */
const openSheet=id=>document.getElementById(id).classList.add('open');
const closeSheet=id=>document.getElementById(id).classList.remove('open');
const IS_ADMIN=/[?&]admin\b/.test(location.search);
if(IS_ADMIN)document.getElementById('edit-btn').classList.remove('hidden');

/* ---------- THEME + HEADER ---------- */
const SWATCHES=[['Violet','#6c63ff'],['Sky','#38bdf8'],['Teal','#14b8a6'],['Pink','#ec4899'],['Orange','#fb923c'],['Lime','#a3e635']];
function curAccent(){let p=null;try{p=localStorage.getItem('attendx_accent');}catch(e){}return(!IS_ADMIN&&p)||st.meta.accent;}
function applyTheme(){document.documentElement.style.setProperty('--accent',curAccent());}
function applyHeader(){
  const m=st.meta;
  document.getElementById('h-badge').textContent=m.badge;document.getElementById('h-badge').style.display=m.badge?'':'none';
  document.getElementById('h-title').textContent=m.title;document.getElementById('h-hl').textContent=m.hl;
  document.getElementById('h-sub').textContent=m.sub;document.getElementById('h-sub').style.display=m.sub?'':'none';
  document.title=(m.title+m.hl)||'Tracker';
}
function setMeta(k,v){st.meta[k]=v;save();applyHeader();}
function setAccent(c){
  if(IS_ADMIN){st.meta.accent=c;save();}else{try{localStorage.setItem('attendx_accent',c);}catch(e){}}
  applyTheme();
}
function resetAccent(){
  if(IS_ADMIN){st.meta.accent=DEFAULT_META.accent;save();}else{try{localStorage.removeItem('attendx_accent');}catch(e){}}
  applyTheme();drawCust();drawPop();
}
function drawPop(){
  const cur=curAccent().toLowerCase();
  document.getElementById('pop').innerHTML=`<div class="sw-row">${SWATCHES.map(([n,c])=>`<button class="sw${c===cur?' sel':''}" style="--c:${c}" title="${n}" aria-label="${n}" onclick="setAccent('${c}');drawPop()"></button>`).join('')}
    <input type="color" value="${cur}" oninput="setAccent(this.value)" onchange="drawPop()" aria-label="Custom color"></div>
    <div class="ed-hint">Changes the color on your device only.</div><button class="pop-reset" onclick="resetAccent()">Use class default</button>`;
}
function openCust(){
  if(IS_ADMIN){drawCust();openSheet('cust');return;}
  const p=document.getElementById('pop');
  if(p.classList.contains('open')){p.classList.remove('open');return;}
  drawPop();p.classList.add('open');
}
document.addEventListener('click',e=>{if(!e.composedPath().some(n=>n.id==='pop'||n.id==='cust-btn'))document.getElementById('pop').classList.remove('open');});
if(!IS_ADMIN)document.getElementById('cust-btn').textContent='Color';
function drawCust(){
  const m=st.meta,cur=curAccent().toLowerCase();
  const fld=(l,k,ph)=>`<label class="t" style="margin-top:10px">${l}</label><input class="ed-in" placeholder="${ph}" value="${esc(m[k])}" oninput="setMeta('${k}',this.value)">`;
  document.getElementById('cust').innerHTML=`<div class="ed-top"><h2>Customize</h2><button class="ed-x" onclick="closeSheet('cust')" aria-label="Close">×</button></div>
    ${IS_ADMIN?`<div class="ed-box"><label class="t">Header text</label>
      ${fld('Badge','badge','e.g. RUET · Civil Engg.')}${fld('Title','title','e.g. Track')}${fld('Highlighted ending of title','hl','e.g. er')}${fld('Subtitle','sub','e.g. Section B · 2nd Year')}
      <div class="ed-hint">Changes show on your screen right away. To publish them to your classmates, copy routine.json below.</div></div>`:''}
    <div class="ed-box"><label class="t">Accent color</label>
      <div class="sw-row">${SWATCHES.map(([n,c])=>`<button class="sw${c===cur?' sel':''}" style="--c:${c}" title="${n}" aria-label="${n}" onclick="setAccent('${c}');drawCust()"></button>`).join('')}
        <input type="color" value="${cur}" oninput="setAccent(this.value)" onchange="drawCust()" aria-label="Custom color"></div>
      <div class="ed-hint">${IS_ADMIN?'This becomes the default color for everyone.':'This only changes the color on your device.'}</div>
      <div class="ed-actions" style="margin-top:10px"><button onclick="resetAccent()">${IS_ADMIN?'Reset to violet':'Use class default'}</button></div></div>
    ${IS_ADMIN?'<div class="ed-actions"><button onclick="copyRoutine(this)">Copy routine.json</button></div>':''}
    <div class="ed-actions"><button class="primary" onclick="closeSheet(\'cust\')">Done</button></div>`;
}

/* ---------- ROUTINE EDITOR ---------- */
let ed=null;
function openEditor(w){ed={week:w,days:clone(sched(w)),scope:'onward'};drawEditor();openSheet('editor');}
function closeEditor(){closeSheet('editor');}
function drawEditor(){
  const el=document.getElementById('editor');
  const opts=Array.from({length:WEEKS},(_,i)=>`<option value="${i}"${i===ed.week?' selected':''}>Week ${i+1}</option>`).join('');
  const days=ed.days.map((d,di)=>`<div class="ed-day"><h3>${d.day}</h3>
    ${d.slots.map((s,si)=>{const n=s._new;delete s._new;return `<div class="ed-slot${n?' new':''}">
      <input class="ed-in" placeholder="Course code" value="${esc(s.code)}" oninput="ed.days[${di}].slots[${si}].code=this.value">
      <input class="ed-in" placeholder="Period" value="${esc(s.period)}" oninput="ed.days[${di}].slots[${si}].period=this.value">
      <input class="ed-in" placeholder="Name · Teacher" value="${esc(s.name)}" oninput="ed.days[${di}].slots[${si}].name=this.value">
      <button class="ed-del" onclick="edDel(${di},${si})" aria-label="Remove class">×</button></div>`;}).join('')}
    <button class="ed-add" onclick="edAdd(${di})">+ Add class</button></div>`).join('');
  el.innerHTML=`<div class="ed-top"><h2>Edit routine</h2><button class="ed-x" onclick="closeEditor()" aria-label="Close">×</button></div>
    <div class="ed-box"><label class="t" for="ed-week">Change the routine for</label>
      <select class="ed-select" id="ed-week" onchange="ed.week=+this.value;ed.days=clone(sched(ed.week));drawEditor()">${opts}</select>
      <div class="ed-hint">Your attendance marks are kept. Only the class list changes. Remove a class on the day it no longer meets.</div></div>
    <div class="ed-box"><label class="t">Apply this to</label><div class="ed-scope">
      <label><input type="radio" name="scope" value="onward" ${ed.scope==='onward'?'checked':''} onchange="ed.scope='onward'">Week ${ed.week+1} and all weeks after</label>
      <label><input type="radio" name="scope" value="only" ${ed.scope==='only'?'checked':''} onchange="ed.scope='only'">Week ${ed.week+1} only</label></div></div>
    ${days}
    <div class="ed-actions"><button onclick="copyRoutine(this)">Copy routine.json</button></div>
    <div class="ed-hint">After saving, tap Copy routine.json and paste it into the routine.json file on your host. Everyone gets the update when they next open the app.</div>
    <div class="ed-actions"><button onclick="closeEditor()">Cancel</button><button class="primary" onclick="saveEditor()">Save routine</button></div>`;
}
function edAdd(di){ed.days[di].slots.push({id:nid(),code:'',name:'',period:'',_new:true});drawEditor();}
function edDel(di,si){ed.days[di].slots.splice(si,1);drawEditor();}
function saveEditor(){
  const w=ed.week;
  const clean=ed.days.map(d=>({day:d.day,slots:d.slots.filter(s=>s.code.trim()).map(s=>({id:s.id,code:s.code.trim(),name:s.name.trim(),period:s.period.trim()}))}));
  const prev=clone(sched(w));
  if(ed.scope==='only'){
    if(w+1<WEEKS&&!st.routines.some(r=>r.from===w+1))st.routines.push({from:w+1,days:prev});
  }else st.routines=st.routines.filter(r=>r.from<=w);
  const ex=st.routines.find(r=>r.from===w);
  if(ex)ex.days=clean;else st.routines.push({from:w,days:clean});
  st.routines.sort((a,b)=>a.from-b.from);
  save();closeEditor();openWeeks.add(w);render();
}

/* ---------- SHARED ROUTINE + HEADER (routine.json) ---------- */
// routine.json holds the class routine and the header/color defaults, so every classmate sees the same thing.
// Each person's attendance marks stay on their own device.
function copyRoutine(btn){
  const txt=JSON.stringify({meta:st.meta,routines:st.routines},null,1);
  const done=()=>{btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy routine.json',1800);};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>prompt('Copy this:',txt));else prompt('Copy this:',txt);
}
async function syncRoutine(){
  if(IS_ADMIN)return; // admin previews edits locally until routine.json is updated
  try{
    const r=await fetch('routine.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    if(!Array.isArray(j.routines)||!j.routines.length)return;
    const meta=Object.assign({},DEFAULT_META,j.meta||{});
    if(JSON.stringify(j.routines)!==JSON.stringify(st.routines)||JSON.stringify(meta)!==JSON.stringify(st.meta)){
      st.routines=j.routines;st.meta=meta;save();applyHeader();applyTheme();render();
    }
  }catch(e){}
}

/* ---------- INSTALL / PWA ---------- */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install-bar').classList.remove('hidden');});
document.getElementById('install-btn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install-bar').classList.add('hidden');};
document.getElementById('install-dismiss').onclick=()=>document.getElementById('install-bar').classList.add('hidden');

  icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236c63ff'/%3E%3Ctext y='.85em' font-size='62' x='18' fill='white' font-weight='900' font-family='system-ui'%3EX%3C/text%3E%3C/svg%3E",sizes:"any",type:"image/svg+xml"}]};
document.getElementById('manifest-placeholder').href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));caches.keys().then(k=>k.forEach(x=>caches.delete(x)));}

applyHeader();applyTheme();
document.querySelectorAll('.header-top,.header-title,.header-sub,.stat,.ring-wrap,.legend,.subj-heading').forEach((el,i)=>{el.classList.add('enter');el.style.setProperty('--d',i*.6);});
render();
syncRoutine();
setTimeout(()=>{const els=document.querySelectorAll('.header,.stats,.ring-wrap,.legend,.weeks,.subj-section');
  els.forEach(el=>el.classList.add('shake'));setTimeout(()=>els.forEach(el=>el.classList.remove('shake')),450);},1330);
</script>
